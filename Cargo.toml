[package]
name = "order-management-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
actix-rt = "2.11.0"
serde = { version = "1.0.228" , features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

[dev-dependencies]
actix-test = "0.1"
